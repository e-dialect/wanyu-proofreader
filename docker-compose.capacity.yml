# Reference acceptance budget only. Combine with a normal Compose file;
# this does not silently change an existing production allocation.
services:
  backend:
    cpus: 2
    mem_limit: 3g
    pids_limit: 128
    environment:
      GOMEMLIMIT: 2300MiB
  frontend:
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
