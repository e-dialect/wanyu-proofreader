version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Shanghai
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: daily
      time: "03:20"
      timezone: Asia/Shanghai
    rebase-strategy: auto
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: daily
      time: "03:40"
      timezone: Asia/Shanghai
    rebase-strategy: auto
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Asia/Shanghai
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: daily
      time: "04:20"
      timezone: Asia/Shanghai
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      go-patch:
        patterns:
          - "*"
        update-types:
          - patch
    commit-message:
      prefix: "build(deps)"
