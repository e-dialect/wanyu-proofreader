# Fragments are interpreted only by the static browser bridge. Never proxy
# PocketBase's admin UI; keep this bridge for >= 7 days after template rollout.
location = /_ {
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  try_files /legacy-account.html =404;
}

location = /_/ {
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  try_files /legacy-account.html =404;
}

location /_/ {
  return 404;
}
