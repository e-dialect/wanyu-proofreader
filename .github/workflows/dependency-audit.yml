name: Dependency audit
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: mkdir -p audit-results
      - name: Audit npm dependencies
        id: npm
        continue-on-error: true
        run: npm audit --prefix frontend --audit-level=high --json > audit-results/npm.json
      - name: Audit reachable Go vulnerabilities
        id: go
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          cd backend
          govulncheck -json ./... > ../audit-results/go.json
      - name: Record outdated dependencies
        if: always()
        run: |
          npm outdated --prefix frontend --json > audit-results/npm-outdated.json || true
          cd backend
          go list -m -u -json all > ../audit-results/go-outdated.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: audit-results/
          retention-days: 30
      - name: Fail on vulnerability or scanner failure
        if: always()
        env:
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          GO_OUTCOME: ${{ steps.go.outcome }}
        run: test "$NPM_OUTCOME" = success && test "$GO_OUTCOME" = success
