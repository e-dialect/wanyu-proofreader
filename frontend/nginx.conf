# Do not put URL/query, referrer, IP, user-agent or token-bearing file URLs into
# edge logs. The backend records the precise route template and request ID.
map $uri $fangji_route_group {
  default frontend;
  ~^/api/realtime realtime;
  ~^/api/ api;
  ~^/_ legacy;
  ~^/assets/ static;
  ~^/fonts/ font;
  ~^/account/ account;
}
log_format fangji_json escape=json '{"ts":"$time_iso8601","component":"nginx","event":"edge_completed","route_group":"$fangji_route_group","method":"$request_method","status":$status,"duration_seconds":$request_time,"response_bytes":$body_bytes_sent,"request_id":"$sent_http_x_request_id"}';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout fangji_json;
  # Per-request upstream errors repeat the raw request line, including query
  # tokens. The structured access status remains visible for every failed call.
  error_log /dev/stderr crit;

  # PDF files accept up to 100 MiB; leave a small allowance for
  # multipart framing while rejecting unexpectedly large requests early.
  client_max_body_size 101m;

  # Trust only the configured edge/container network, then overwrite all
  # client-supplied forwarding headers before proxying to PocketBase.
  include /etc/nginx/snippets/trusted-proxies.conf;
  real_ip_header X-Real-IP;
  real_ip_recursive off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' blob: https: wss:; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  set $asset_cache_control "";
  add_header Cache-Control $asset_cache_control;

  root /usr/share/nginx/html;
  index index.html;

  location /api/realtime {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_pass http://backend:8090;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:8090;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /runtime-config.js {
    set $asset_cache_control "no-store";
    try_files $uri =404;
  }

  location = /index.html {
    set $asset_cache_control "no-cache";
  }

  location /assets/ {
    set $asset_cache_control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  include /etc/nginx/snippets/pocketbase-admin.conf;

  # Hashed font assets are immutable; never serve the SPA for a missing font.
  location ~ "^/fonts/(rare-han/rare-[a-f0-9]+-|phonetic/(?:phonetic|symbols)-)[a-f0-9]{12}\.woff2$" {
    set $asset_cache_control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
