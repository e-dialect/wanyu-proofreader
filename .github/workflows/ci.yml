name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pocketbase-compatibility:
    name: PocketBase compatibility (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [core_logic, upload_jobs, proofreading_quorum, task_leases, project_access, phase1, pdf_access, pdf_reuse, keyboards, column_order, volunteer_accounts]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 backend/tests/run_integration.py ${{ matrix.suite }}_integration.mjs

  core-workflows:
    name: Core workflow (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - upload_jobs_integration.mjs
          - pdf_chunks_integration.mjs
          - core_logic_integration.mjs
          - proofreading_quorum_integration.mjs
          - task_leases_integration.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run against a freshly migrated disposable database
        run: python3 backend/tests/run_integration.py ${{ matrix.suite }}

  chunk-upload-browser:
    name: Chunk upload browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/upload-browser" playwright@1.62.1
          "$RUNNER_TEMP/upload-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify retries and upload progress
        env:
          NODE_PATH: ${{ runner.temp }}/upload-browser/node_modules
          PDF_UPLOAD_BROWSER_SCRIPT: ${{ github.workspace }}/backend/tests/pdf_upload_browser.cjs
          PDF_BROWSER_FIXTURE: ${{ runner.temp }}/upload-browser-fixture.json
        run: python3 backend/tests/run_integration.py pdf_chunks_integration.mjs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build

  backend-unicode:
    name: Backend Unicode workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run backend tests
        working-directory: backend
        run: go test ./...
      - name: Verify PDF affinity migration and rollback
        run: python3 backend/tests/check_pdf_affinity.py
      - name: Verify join retention migration and rollback
        run: python3 backend/tests/check_join_retention.py
      - name: Verify offline backup and restore
        run: python3 -m unittest discover -s backend/tests -p test_backup.py
      - name: Test keyboard CSV coverage audit
        run: python3 -m unittest discover -s backend/tests -p test_keyboard_audit.py
      - name: Verify Unicode import, proofreading, arbitration and restart persistence
        run: python3 backend/tests/run_rare_characters_integration.py

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose entry points
        env:
          TRAEFIK_HOST: fangji.example.com
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.traefik.yml config --quiet

          docker compose -f docker-compose.yml -f docker-compose.named-volume.yml config --quiet
          docker compose -f docker-compose.dev.yml -f docker-compose.named-volume.yml config --quiet
          docker compose -f docker-compose.traefik.yml -f docker-compose.named-volume.yml config --quiet

      - name: Verify administrator UI entrypoint defaults and explicit override
        env:
          TRAEFIK_HOST: fangji.example.com
        run: |
          env -u ENABLE_POCKETBASE_ADMIN_UI docker compose -f docker-compose.traefik.yml config --format json | jq -e '.services.frontend.environment.ENABLE_POCKETBASE_ADMIN_UI == "true"'
          ENABLE_POCKETBASE_ADMIN_UI=false docker compose -f docker-compose.traefik.yml config --format json | jq -e '.services.frontend.environment.ENABLE_POCKETBASE_ADMIN_UI == "false"'
          env -u ENABLE_POCKETBASE_ADMIN_UI docker compose config --format json | jq -e '.services.frontend.environment.ENABLE_POCKETBASE_ADMIN_UI == "false"'

      - name: Verify Compose entry point behavior
        env:
          TRAEFIK_HOST: fangji.example.com
        run: |
          docker compose config --format json | jq -e '
            (.services.frontend.ports | length == 1) and
            (.services.frontend.ports[0].published == "8080") and
            (.services.frontend.ports[0].target == 8080) and
            ((.services.frontend.labels // {}) | length == 0) and
            ((.services.backend.ports // []) | length == 0)
          '

          docker compose -f docker-compose.dev.yml config --format json | jq -e '
            (.services.frontend.ports[0].published == "5250") and
            (.services.backend.ports[0].host_ip == "127.0.0.1") and
            (.services.backend.ports[0].published == "8090")
          '

          docker compose -f docker-compose.traefik.yml config --format json | jq -e '
            ((.services.frontend.ports // []) | length == 0) and
            ((.services.backend.ports // []) | length == 0) and
            (.services.frontend.networks | has("app")) and
            (.services.frontend.networks | has("traefik")) and
            (.services.backend.networks | has("app")) and
            ((.services.backend.networks | has("traefik")) | not) and
            (.networks.traefik.external == true) and
            (.networks.traefik.name == "traefik-global-proxy") and
            (.services.frontend.labels["traefik.docker.network"] == "traefik-global-proxy") and
            (.services.frontend.labels["traefik.http.routers.fangji.rule"] == "Host(`fangji.example.com`)") and
            (.services.frontend.labels["traefik.http.services.fangji.loadbalancer.server.port"] == "8080")
          '

      - name: Verify production privilege restrictions
        env:
          TRAEFIK_HOST: fangji.example.com
        run: |
          for config in docker-compose.yml docker-compose.traefik.yml; do
            docker compose -f "$config" config --format json | jq -e '
              (.services.backend.read_only == true) and
              (.services.backend.cap_drop == ["ALL"]) and
              (.services.frontend.cap_drop == ["ALL"]) and
              (.services.backend.security_opt | index("no-new-privileges:true") != null) and
              (.services.frontend.security_opt | index("no-new-privileges:true") != null)
            '
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: fangji-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: fangji-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify trusted proxy rate limiting
        run: sh frontend/tests/proxyRateLimit.e2e.sh

  profile-stats:
    name: profile-stats integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 backend/tests/run_integration.py phase1_integration.mjs

  project-management:
    name: project-management integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 backend/tests/run_integration.py project_access_integration.mjs

  column-order:
    name: column-order integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: go test ./...
        working-directory: backend
      - run: python3 backend/tests/run_integration.py column_order_integration.mjs

  pdf-access:
    name: pdf-access integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: go test ./...
        working-directory: backend
      - run: python3 backend/tests/run_integration.py pdf_access_integration.mjs
      - name: Install PDF rendering test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pdf-browser" playwright@1.62.1
          "$RUNNER_TEMP/pdf-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare synthetic task PDFs with PDF.js
        env:
          FANGJI_PDF_RENDER: "1"
          NODE_PATH: ${{ runner.temp }}/pdf-browser/node_modules
        run: go test -C backend -run '^TestTaskPDFBrowserRegression$' -count=1 -v
      - name: Build production UI for same-page reuse regression
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Verify cross-task PDF reader reuse
        env:
          NODE_PATH: ${{ runner.temp }}/pdf-browser/node_modules
          PDF_REUSE_BROWSER_SCRIPT: ${{ github.workspace }}/backend/tests/pdf_reuse_browser.cjs
          PDF_BROWSER_FIXTURE: ${{ runner.temp }}/pdf-reuse-fixture.json
        run: python3 backend/tests/run_integration.py pdf_reuse_integration.mjs
